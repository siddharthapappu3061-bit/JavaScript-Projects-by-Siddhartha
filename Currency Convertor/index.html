<!DOCTYPE html>
<html>
  <head>
    <title>Currency Convertor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id = "work-area">
        <h1 class="title">Currency Convertor</h1>
        <div id = "entering-amount">
            <h3 id = "enter-box">Enter amount:</h3>
            <input id = "amount" placeholder="100"/>
        </div>
        <div id = "choosing-currencies">
            <select id="from-currency">
                <option value="">Select Country</option>
            </select>
            <b id = "to">TO</b>
            <select id="to-currency">
                <option value="">Select Country</option>
            </select>
        </div>
        <div id = "conversion">
            <button id = "convertor">Convert</button>
        </div>
    </div>
  </body>
  <script src="app.js"></script>
</html>
